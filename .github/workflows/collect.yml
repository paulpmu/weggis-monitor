name: Status abfragen

# Jeder Lauf fragt ca. 55 Minuten lang alle 5 Minuten ab und startet am Ende
# selbst den naechsten Lauf. Der stuendliche Zeitplan ist nur die Reserve,
# falls die Kette abreisst (GitHub fuehrt Zeitplaene oft nur alle paar Stunden aus).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Datenzweig "data" bereitstellen
        run: |
          git config --global user.name "weggis-monitor"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data store origin/data
          else
            git worktree add --detach store
            git -C store checkout --orphan data
            git -C store rm -rfq .
          fi

      - name: Abfragen alle 5 Minuten (ca. 55 Minuten lang)
        run: |
          end=$(( $(date +%s) + 55 * 60 ))
          while :; do
            python3 collector/collect.py store/status.json
            git -C store add status.json
            git -C store commit -qm "Status $(TZ=Europe/Zurich date '+%d.%m.%Y %H:%M')"
            for i in 1 2 3; do
              git -C store push -q origin data && break
              sleep $((i * 5))
            done
            wait=$(( 300 - $(date +%s) % 300 ))   # bis zur naechsten 5-Minuten-Marke
            [ $(( $(date +%s) + wait )) -ge "$end" ] && break
            sleep "$wait"
          done

      - name: Naechsten Lauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -f ref=main
